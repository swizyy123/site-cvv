<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Модальное окно</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="modal" id="login">
        <a class="modal__close" href="#"></a>
        <div class="modal__window">
            <p class="modal__title">Вход</p>
           <form method="post">
                <input class="modal__input" type="text" placeholder="Логин">
                <input class="modal__input" type="password" placeholder="Пароль">
                <label class="modal__check">
    <input class="modal__check-box" type="checkbox">
    <span class="modal__checkmark"></span>
    Запомнить
</label>
                <input class="modal__btn" type="button" value="Войти">
            </form>
        </div>
    </div>

</body>
</html>
